plugins { id 'com.android.application' }
android {
    namespace 'com.harlequin.grimgrimoire'
    compileSdk 35
    defaultConfig { applicationId 'com.harlequin.grimgrimoire'; minSdk 24; targetSdk 34; versionCode 1; versionName '0.1.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'bin' }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { testLogging { events 'passed', 'failed'; showStandardStreams true } } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
